name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: all the test job needs.
permissions:
  contents: read

jobs:
  test:
    name: pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Pin Python rather than using the runner's system interpreter, which
      # changes under us (ubuntu-latest moved to 3.14 in Nov 2026).
      UV_PYTHON: "3.12"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Verify the committed lockfile satisfies pyproject.toml
        run: uv lock --locked

      - name: Install the locked environment
        run: uv sync --locked

      # The suite is fully offline. The SSO page fixtures are not in this repo, so the
      # tests that parse them are skipped here (see tests/conftest.py).
      - name: Run tests
        run: uv run pytest -q
